[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "form4api"
version = "0.6.0"
description = "Python client for the Form4API — real-time SEC Form 4 insider trading data"
keywords = ["insider-trading", "sec", "sec-edgar", "edgar", "form-4", "form4", "form-144", "13f", "13f-hr", "financial-data", "stock-market", "stocks", "fintech", "api", "sdk", "webhooks", "form4api"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
license = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://www.form4api.com"
Documentation = "https://www.form4api.com/docs"
Repository = "https://github.com/theodor90/form4api-py.git"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["form4api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
